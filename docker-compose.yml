services:
  db:
    image: postgres:16-alpine
    container_name: oil-forecast-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oil_forecast}
      POSTGRES_USER: ${POSTGRES_USER:-oil_forecast}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
    container_name: oil-forecast-app
    command: python -m streamlit run app_main.py --server.address 0.0.0.0 --server.port 8502
    ports:
      - "8502:8502"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - TRAIN_DEVICE=cpu
      - STREAMLIT_SERVER_HEADLESS=true
      - PGHOST=db
      - PGPORT=5432
      - PGDATABASE=${POSTGRES_DB:-oil_forecast}
      - PGUSER=${POSTGRES_USER:-oil_forecast}
      - PGPASSWORD=${POSTGRES_PASSWORD:-change-me}
    volumes:
      - ./checkpoints_multi:/app/checkpoints_multi
      - ./datasets:/app/datasets
      - ./logs:/app/logs
    restart: unless-stopped

  train:
    build:
      context: .
    container_name: oil-forecast-train
    command: python train_all_horizons.py --models GUMNet --horizons 1 5 10 15 20 30 60 --epochs 20
    environment:
      - TRAIN_DEVICE=cpu
    volumes:
      - ./checkpoints_multi:/app/checkpoints_multi
      - ./datasets:/app/datasets
      - ./logs:/app/logs
    restart: "no"

volumes:
  postgres_data:
